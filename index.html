<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Recording · BugSnap</title>
    <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="" class="mark" title="All recordings" aria-label="All recordings"><img src="logo.svg" alt="" /></a>
      <div class="titles">
        <h1 id="title"><span class="sk sk-title"></span></h1>
        <div id="subtitle" class="sub"><span class="sk sk-line"></span></div>
      </div>
      <div class="top-actions">
        <button class="btn ghost icon-only" id="popout" title="Pop out" aria-label="Pop out" data-icon="arrows-out-simple"></button>
        <a class="btn ghost icon-only" id="download" title="Download" aria-label="Download" data-icon="download-simple"></a>
        <button class="btn primary" id="copyLink"><span class="icon" data-icon="link-simple"></span><span>Copy link</span></button>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden><span class="icon" id="bannerIcon" data-icon="info"></span><span id="bannerText"></span><button class="btn sm" id="bannerAction" hidden></button></div>

    <main class="layout" id="layout">
      <section class="stage">
        <div class="video-wrap"><video id="video" controls playsinline preload="metadata"></video></div>

        <div class="transport">
          <button class="btn ghost icon-only sm" data-skip="-5" title="Back 5 seconds (J)" aria-label="Back 5 seconds" data-icon="arrow-counter-clockwise"></button>
          <button class="btn ghost icon-only sm" data-skip="5" title="Forward 5 seconds (L)" aria-label="Forward 5 seconds" data-icon="arrow-clockwise"></button>
          <span class="clock" id="clock">0:00 / 0:00</span>
          <div class="segmented" id="speeds" role="group" aria-label="Playback speed">
            <button data-rate="0.5">0.5x</button>
            <button data-rate="1" class="on">1x</button>
            <button data-rate="1.5">1.5x</button>
            <button data-rate="2">2x</button>
          </div>
        </div>

        <div class="timeline" id="timeline" role="slider" aria-label="Seek" tabindex="0">
          <div class="rail"><div class="progress" id="progress"></div></div>
          <div class="markers" id="markers"></div>
          <div class="playhead" id="playhead"></div>
        </div>
        <div class="legend">
          <span><i class="k action"></i>Action</span>
          <span><i class="k navigation"></i>Page</span>
          <span><i class="k error"></i>Error</span>
        </div>
      </section>

      <aside class="side panel">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="steps" class="on" aria-selected="true">Steps<span class="count" id="c-steps"></span></button>
          <button role="tab" data-tab="console" aria-selected="false">Console<span class="count" id="c-console"></span><span class="errs" id="e-console" hidden></span></button>
          <button role="tab" data-tab="network" aria-selected="false">Network<span class="count" id="c-network"></span><span class="errs" id="e-network" hidden></span></button>
          <button role="tab" data-tab="info" aria-selected="false">Details</button>
          <button role="tab" data-tab="report" aria-selected="false">Report</button>
        </nav>
        <div class="toolbar" id="toolbar">
          <label class="search"><span class="icon" data-icon="magnifying-glass"></span><input id="search" type="search" placeholder="Search" aria-label="Search" /></label>
          <div class="segmented sm" id="levels" role="group" aria-label="Console level" hidden>
            <button data-level="all" class="on">All</button>
            <button data-level="warn">Warnings</button>
            <button data-level="error">Errors</button>
          </div>
          <label class="switch follow" for="follow" title="Scroll with the video"><input type="checkbox" id="follow" checked />Follow</label>
        </div>
        <div class="pane" id="pane-steps"><ol class="events" id="list-steps"></ol></div>
        <div class="pane" id="pane-console" hidden><ol class="events" id="list-console"></ol></div>
        <div class="pane" id="pane-network" hidden><ol class="events" id="list-network"></ol></div>
        <div class="pane" id="pane-info" hidden><div id="info" class="info"></div></div>
        <div class="pane report" id="pane-report" hidden>
          <p class="hint">Draft from this recording. Add what you expected, then copy.</p>
          <textarea id="report" spellcheck="true" aria-label="Bug report draft"></textarea>
          <div><button class="btn primary" id="copyReport"><span class="icon" data-icon="copy"></span><span>Copy</span></button></div>
        </div>
      </aside>
    </main>

    <section class="notfound" id="notfound" hidden>
      <span class="icon" data-icon="film-slate"></span>
      <h2>Recording not found</h2>
      <p>Check the link, or it may have been deleted.</p>
      <a class="btn" href="" data-local-only>All recordings</a>
    </section>

    <script src="icons.js"></script>
    <script src="config.js"></script>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
